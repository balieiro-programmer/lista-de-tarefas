<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  
  <title>Minha Lista de Tarefas</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">

    <header>
       <h1>Minha Lista de Tarefas</h1>
       <p>Organize suas atividades e acompanhe seu progresso.</p> 
    </header>

    <section class="card">
       <form id="form-tarefa">

          <input
             type="text"
             id="tarefa"
             placeholder="Digite uma nova tarefa..."
             autocomplete="off"
          >
          
          <button type="submit" id="adicionar">
            Adicionar tarefa
          </button>
       </form>  

<div class="resumo">
    <p id="contador">Tarefas: 0</p>
    <p id="concluidas">Concluídas: 0</p>
</div>

<button id="limpar-concluidas">
    Limpar concluídas
</button>

       <ul id="lista-tarefas">
          <!-- As tarefas serão adicionadas aqui pelo JavaScript -->
       </ul>
    </section>

  </main>

</body>
</html>
