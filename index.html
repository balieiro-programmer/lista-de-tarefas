<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Gerador de Senhas</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
    
  <main class="container">

    <h1>Gerador de Senhas</h1>
    <p>Crie uma senha forte e segura.</p>

    <section class="gerador">
    
       <label for="senha">Sua senha:</label>
       <div class="campo-senha">
        <input
           type="text"
           id="senha"
           placeholder="Sua senha aparecerá aqui"
           readonly
        >
        
        <button id="copiar">Copiar</button>
       </div>
        <label for="tamanho">Tamanho da senha:</label>
        <input type="number" id="tamanho" min="4" max="32" value="12">

        <h3>Tipos de caracteres</h3>

        <label>
           <input type="checkbox" id="maiusculas" checked>
           Letras maiúsculas
        </label>
        
        <label>
           <input type="checkbox" id="minusculas" checked>
           Letras minúsculas
        </label>

        <label>
           <input type="checkbox" id="numeros" checked>
           Números
        </label>

        <label>
           <input type="checkbox" id="simbolos" checked>
           Símbolos
        </label>

        <button id="gerar">Gerar Senha</button>
    </section>  
</main>  

</body>
</html>
